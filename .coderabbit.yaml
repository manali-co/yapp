# CodeRabbit review settings for manali-co/yapp. Docs: https://docs.coderabbit.ai/reference/configuration
language: en-US
tone_instructions: >
  Review against docs/PRINCIPLES.md: Yapp is generic voice computer use for macOS where Jev
  decides and code executes. Flag any product code that special-cases a particular application,
  menu item, or window title; any action reaching the machine without the guard; anything that
  can take the user's focus, cover their front window, or close or delete what is theirs; and
  harness-only behaviour that could run inside the app. Prefer generic mechanisms over patterns.
knowledge_base:
  code_guidelines:
    filePatterns:
      - "docs/PRINCIPLES.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/superpowers/specs/*.md"
reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    base_branches: [dev, main]
  path_instructions:
    - path: "src/yapp/executor.py"
      instructions: >
        This file sends keystrokes and shell commands on the user's Mac. Flag any new command
        that is not routed through the `run` seam, any AppleScript built from unescaped user
        text, and any action that could delete, send, or spend without passing the guard.
    - path: "src/yapp/guard.py"
      instructions: >
        The permission guard. Any change to thresholds, to what counts as an ask, or to the
        failure path (a Jev error must never allow an action) needs an explicit justification
        in the PR and a test.
    - path: "src/yapp/native.py"
      instructions: >
        PyObjC and Accessibility code. Check main-thread requirements (AppKit, Text Services),
        that nothing here blocks the Cocoa run loop, and that AX attribute writes are limited
        to windows Yapp created.
    - path: "src/yapp/bundle.py"
      instructions: >
        Builds the .app bundle. Flag anything that weakens code signing, adds entitlements, or
        writes outside ~/Applications and ~/.yapp.
    - path: "src/yapp/questions.yaml"
      instructions: >
        Jev question criteria. Examples must be generic phrasings, never app-specific
        hardcoding; true/false keys must be quoted strings.
    - path: "src/yapp/{workspace,highlight,placement,ledger,pointer,windows}.py"
      instructions: >
        The parallel-mode machinery. Check: no window raised or focus borrowed while the user
        is typing; the glow never marks the user's own window or covers their front window;
        clean-up touches only what Yapp opened; nothing here names a specific application.
    - path: "src/yapp/tasks.py"
      instructions: >
        The benchmark harness, not the product: it may quit apps and delete items a task
        created, but must prove ownership (snapshot diff + the task's dictated words) and must
        never be imported by the app's runtime path.
    - path: "tests/**"
      instructions: Tests must not need the network or a TYPESAFE_API_KEY unless marked `jev`.
  tools:
    ruff:
      enabled: true
    gitleaks:
      enabled: true
    semgrep:
      enabled: true
    actionlint:
      enabled: true
chat:
  auto_reply: true
