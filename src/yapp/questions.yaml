intent:
  instructions: >
    What does the user want the computer to do with instruction_so_far?
    Judge only the first instruction if several are chained with "and" or "then".
  criteria:
    open_app:
      what: Launch an application or bring it to the front
      not_for: Opening a named document or file (that is open_file); commands inside the current app (that is screen_action)
      examples: ["open notes", "launch safari", "switch to slack", "bring up the terminal", "go to chrome"]
    type_text:
      what: Type or dictate words into the app that is currently focused
      not_for: Naming an app or a file to open
      examples: ["type hello there", "write dear sam", "say thanks for the update", "enter my address"]
    open_file:
      what: Open a specific document, note, or file by its name
      not_for: Launching an app with no file named
      examples: ["open my resume", "find the budget spreadsheet", "show the tax pdf"]
    press_key:
      what: Press one of the basic keyboard shortcuts (save, copy, paste, select all, close, enter, escape)
      not_for: Typing words; commands that live in an app's menus or buttons (that is screen_action)
      examples: ["save", "copy that", "paste", "select all", "hit enter", "press escape"]
    screen_action:
      what: Do something inside the app in front by naming a menu command, button, tab, link, or field
      not_for: Launching a different app; typing free text with no field named; the basic shortcuts above
      examples: ["new tab", "new document", "new reminder", "zoom in", "find on page", "search for fable five", "bold this", "close this tab", "go to the address bar", "reply to this email", "click sign in", "show downloads", "go to downloads"]
    undo:
      what: Reverse or cancel what Yapp just did
      not_for: The undo shortcut inside an app while dictating a document
      examples: ["undo", "no", "not that", "undo that", "wrong app"]
    cleanup:
      what: Close what Yapp opened during this session and put the user's windows back
      not_for: Closing something the user opened themselves (that is screen_action)
      examples: ["clean up", "close everything", "we're done", "close what you opened", "put it back", "you can close all that", "tidy up"]
    none:
      what: Not an instruction to the computer, or too unclear to act on
      examples: ["um", "what was I", "hmm let me think", "okay so"]

key_combo:
  instructions: Which keyboard shortcut does the user mean?
  criteria:
    cmd+s: Save
    cmd+c: Copy
    cmd+v: Paste
    cmd+a: Select all
    cmd+w: Close the window or tab
    enter: Press enter or return
    escape: Escape or cancel
    unsure: None of these or not a shortcut

is_complete:
  instructions: >
    The first instruction in instruction_so_far is complete: it names an action and, where
    one is needed, its target, so it can be carried out right now. Trailing connectors such
    as "and", "then", or "and then" after a complete instruction do NOT make it incomplete.
    A fragment that is still missing its target is incomplete.
  criteria:
    "true":
      what: A verb and its target are both present (or the verb needs no target)
      examples: ["open notes", "open notes and", "open notes and then", "switch to safari and", "type hello", "save", "undo", "copy that", "new tab", "new document and then", "new reminder and then type buy stamps", "new note", "zoom in", "find on page", "search for cats", "bold this", "close this tab", "next tab and", "show downloads", "clear history", "clean up", "we're done", "close everything"]
    "false":
      what: The verb has no target yet, or only filler so far
      examples: ["open", "switch to", "go to the", "um open", "type", "and", "open the", "search for", "find", "new", "zoom"]

ends_dictation:
  instructions: >
    The user is dictating text into an app. instruction_so_far is a new instruction to the
    computer rather than more words to type.
  criteria:
    "true":
      what: A command aimed at the computer
      examples: ["stop typing", "open safari", "undo", "switch to notes", "save that", "clean up", "we're done", "close everything", "put it back"]
    "false":
      what: Ordinary sentence content that belongs in the document
      examples: ["and then we went home", "thanks for your help", "the meeting is at five", "open to suggestions"]

is_addressed:
  instructions: >
    instruction_so_far was said to the computer (a command or something to type), not to
    another person in the room and not thinking aloud.
  criteria:
    "true":
      what: Speech meant for the computer
      examples: ["open notes", "type dear sam", "new tab", "search for cats", "close this", "zoom in", "save that"]
    "false":
      what: Conversation with someone else, or musing
      examples: ["yeah let's grab lunch at one", "did you see the game last night", "hold on someone's at the door", "i think we should ship it tomorrow", "no you go first", "what do you want for dinner"]

is_harmful:
  instructions: >
    Yapp is about to perform `action` on the user's Mac (`screen` describes what is in front).
    The action is harmful if it is hard to undo or reaches outside the machine: it deletes or
    discards data, sends or posts or shares something, spends money, signs out, changes system
    or account settings, overwrites a file, or runs commands in a terminal. Reading, opening,
    navigating, searching, zooming, saving, undoing, and typing into a draft are not harmful.
  criteria:
    "true":
      what: Hard to undo, or reaches other people, money, or the system
      examples: ["press Empty Trash in Finder", "press Send in Mail", "press Delete in Notes", "press Move to Trash in Finder", "press Buy now in Safari", "press Sign Out in Slack", "press Don't Save in TextEdit", "open Terminal", "dictate into Terminal", "press Restart in System Settings", "press Remove Account in System Settings", "press Delete Conversation in Messages"]
    "false":
      what: Reversible and local
      examples: ["open Notes", "open Google Chrome", "press New Tab in Google Chrome", "type 'weather in toronto' into Address and search bar in Google Chrome", "press Zoom In in Safari", "press Save in TextEdit", "press Undo in Notes", "open file budget.xlsx", "open System Settings", "open Finder", "close the windows and apps Yapp opened", "press Bold in Pages", "dictate into TextEdit", "press Back in Google Chrome", "press New Note in Notes", "press cmd+c in Finder"]

reply:
  criteria:
    approve:
      what: Permission to go ahead
      examples: ["yes", "yeah", "yep", "go ahead", "do it", "sure", "ok", "okay", "confirm", "yes do it", "go for it"]
    deny:
      what: Refusal or cancel
      examples: ["no", "nope", "stop", "cancel", "don't", "wait", "no don't", "never mind", "not that"]
    unrelated:
      what: Not an answer to the question
      examples: ["open notes", "let's get lunch", "um", "what time is it", "hold on"]
